# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - dmdu

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          SOURCE_DIR=$GITHUB_WORKSPACE
          DEST_DIR=$GITHUB_WORKSPACE/output
          INTERMEDIATE_DIR=$GITHUB_WORKSPACE/oryx_temp
          VENV_DIR=$DEST_DIR/antenv

          mkdir -p $DEST_DIR $INTERMEDIATE_DIR

          # Build Python app with Oryx
          oryx build $SOURCE_DIR \
            -o $DEST_DIR \
            --platform python \
            --platform-version 3.11 \
            -p virtualenv_name=$VENV_DIR \
            -i $INTERMEDIATE_DIR \
            --compress-destination-dir

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: output/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Required for requesting the JWT
      contents: read # Required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3EF5C30C28BF4FD9AB685B749D600D06 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_070B6445EF344FCABD5BADA557AACAB8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FB5393D6CF824FA2A4DE3CFFA4E34FD4 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'dmdu'
          slot-name: 'Production'
          package: output/
